spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari: {maximum-pool-size: ${DB_POOL_SIZE:10}, minimum-idle: 2, connection-timeout: 30000}
  jpa.hibernate.ddl-auto: validate
  flyway.enabled: true
logging:
  pattern.console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%level","logger":"%logger{36}","message":"%replace(%msg){''(?i)(password|token|secret)=\\S+'',''$1=[REDACTED]''}%n"}'
