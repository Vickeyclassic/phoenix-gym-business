spring:
  application.name: phoenix-gym-business
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/phoenix_business?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate.ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error.include-message: never
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.show-details: when_authorized
app:
  jwt-secret: ${JWT_SECRET}
  jwt-expiration-ms: ${JWT_EXPIRATION_MS:900000}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap-owner-username: ${BOOTSTRAP_OWNER_USERNAME:owner}
  bootstrap-owner-password: ${BOOTSTRAP_OWNER_PASSWORD:}
