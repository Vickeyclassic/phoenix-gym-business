# Standalone LOCAL environment. Do not merge with docker-compose.yml.
name: phoenix-bg-fitness-local
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: phoenix_bg_fitness_local
      MYSQL_USER: bg_local
      MYSQL_PASSWORD: ${BG_DB_PASSWORD:?Run the local setup script}
      MYSQL_ROOT_PASSWORD: ${BG_DB_ROOT_PASSWORD:?Run the local setup script}
    volumes: [bg_fitness_local_data:/var/lib/mysql]
    networks: [database]
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/phoenix_bg_fitness_local?serverTimezone=UTC
      DB_USERNAME: bg_local
      DB_PASSWORD: ${BG_DB_PASSWORD:?Run the local setup script}
      JWT_SECRET: ${BG_JWT_SECRET:?Run the local setup script}
      CORS_ALLOWED_ORIGINS: http://localhost:5183
      BOOTSTRAP_OWNER_USERNAME: bg_owner
      BOOTSTRAP_OWNER_PASSWORD: ${BG_OWNER_PASSWORD:?Run the local setup script}
      APP_BOOTSTRAP_BUSINESS_NAME: B.G. Fitness
      APP_BOOTSTRAP_LOGO_URL: /api/public/branding-assets/bg-fitness.jpg
      APP_BRANDING_DIRECTORY: /branding
    ports: ['127.0.0.1:8083:8080']
    volumes: ['./clients/bg-fitness/branding:/branding:rw']
    networks: [web, database]
    depends_on: {mysql: {condition: service_healthy}}
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  frontend:
    build:
      context: ./frontend
      args: {VITE_API_URL: 'http://localhost:8083/api'}
    restart: unless-stopped
    ports: ['127.0.0.1:5183:80']
    networks: [web]
    depends_on: {backend: {condition: service_healthy}}
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 10
networks:
  web: {}
  database: {internal: true}
volumes:
  bg_fitness_local_data: {}
