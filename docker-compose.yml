services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: phoenix_business
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    ports: ["3307:3306"]
    volumes: ["phoenix_mysql:/var/lib/mysql"]
    healthcheck: {test: ["CMD","mysqladmin","ping","-h","localhost"], interval: 10s, timeout: 5s, retries: 10}
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/phoenix_business?serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173}"
      BOOTSTRAP_OWNER_PASSWORD: "${BOOTSTRAP_OWNER_PASSWORD:?Set BOOTSTRAP_OWNER_PASSWORD in .env}"
    ports: ["8080:8080"]
    depends_on: {mysql: {condition: service_healthy}}
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8080/api}"
    ports: ["5173:80"]
    depends_on: [backend]
volumes: {phoenix_mysql: {}}
